[project]
name = "recheck"
version = "0.1.0"
description = "Trust, but re-check: certified memory reuse for agents in a changing world"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ashish Goel" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
laya = ["laya"]                # System One judge (Convai Innovations, Apache 2.0)
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
recheck = "recheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905"]
