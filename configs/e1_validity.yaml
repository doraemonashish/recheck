# E1. Does the certificate hold? 20 worlds; subagents misread 5% of reports and users misstate 3%,
# so provenance classes differ in reliability at the same age. The claim to check: certified
# arms keep every class under alpha on (almost) every seed; batch calibration and pooled
# certification do not.
name: e1_validity
alpha: 0.05
burn_in_days: 10
seeds: 20
world: {days: 60, subagent_error: 0.05, user_error: 0.03}
arms:
  - {name: never-recheck, policy: {type: never}}
  - {name: ttl-1d, policy: {type: ttl, days: 1}}
  - {name: hazard-0.05, policy: {type: hazard, theta: 0.05}}
  - {name: ltt-batch, policy: {type: ltt, alpha: 0.05, n_calib: 2000}}
  - {name: ltt-batch-grouped, policy: {type: ltt, alpha: 0.05, n_calib: 2000, by_group: true}}
  - {name: aci-0.05, policy: {type: aci, alpha: 0.05}}
  - {name: aci-0.025, policy: {type: aci, alpha: 0.025}}
  - {name: aci-0.05-pooled, policy: {type: aci, alpha: 0.05, by_group: false}}
  - {name: certified-pooled, policy: {type: certified, alpha: 0.05, by_group: false}}
  - {name: certified, policy: {type: certified, alpha: 0.05}}
  - {name: certified-ppi, policy: {type: certified, alpha: 0.05, use_judge: true}, judge: {type: calibrated, sigma: 0.1}}
