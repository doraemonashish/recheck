# E5. The agent's own inferences. Kept with their justification (premises) they retract when a
# premise changes and are scored by the Boole bound; laundered into plain facts they go stale
# silently.
name: e5_inferences
alpha: 0.05
burn_in_days: 10
seeds: 10
world: {days: 60, derived_frac: 0.4}
arms:
  - {name: justified-boole, policy: {type: certified, alpha: 0.05}}
  - {name: justified-product, policy: {type: certified, alpha: 0.05}, memory: {combine: product}}
  - {name: laundered-certified, policy: {type: certified, alpha: 0.05}, memory: {launder: true}}
  - {name: laundered-never, policy: {type: never}, memory: {launder: true}}
  - {name: justified-never, policy: {type: never}}
