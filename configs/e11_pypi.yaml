# E11. Real change traces: the latest stable release of ~150 Python packages on PyPI, with real
# upload times (data/pypi_releases.json.gz, scripts/fetch_pypi_traces.py). Each seed is a
# different one-year window between 2021 and 2023. Release cadence is bursty and very uneven
# (botocore most weekdays, many packages a few times a year), so a rate per package matters.
# Subagents misread 5% of what they report (they read an old changelog).
name: e11_pypi
alpha: 0.05
burn_in_days: 30
seeds: 8
world: {source: pypi, start: "2021-01-01", days: 365, subagent_error: 0.05}
arms:
  - {name: never-recheck, policy: {type: never}}
  - {name: ttl-1d, policy: {type: ttl, days: 1}}
  - {name: ttl-3d, policy: {type: ttl, days: 3}}
  - {name: ttl-7d, policy: {type: ttl, days: 7}}
  - {name: hazard-0.05, policy: {type: hazard, theta: 0.05}}
  - {name: hazard-0.05-per-package, policy: {type: hazard, theta: 0.05}, memory: {per_slot: true}}
  - {name: ltt-batch, policy: {type: ltt, alpha: 0.05, n_calib: 2000}, memory: {per_slot: true}}
  - {name: aci-0.05, policy: {type: aci, alpha: 0.05}, memory: {per_slot: true}}
  - {name: certified-pooled, policy: {type: certified, alpha: 0.05, by_group: false}, memory: {per_slot: true}}
  - {name: certified-per-kind, policy: {type: certified, alpha: 0.05}}
  - {name: certified, policy: {type: certified, alpha: 0.05}, memory: {per_slot: true}}
  - {name: guided-biased, policy: {type: certified, alpha: 0.05, use_judge: true, judge_audit_gain: 0.9}, judge: {type: biased, eps: 0.01, soft: 0.01}, memory: {per_slot: true}}
