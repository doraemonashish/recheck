# E12 (needs a model). Real PyPI traces with an LLM through Ollama as the judge. An LLM knows
# roughly how often numpy or botocore release, which the hazard model has to learn. Run from
# notebooks/02_ollama.ipynb after E9.
name: e12_pypi_llm
needs_model: true
alpha: 0.05
burn_in_days: 20
seeds: 2
world: {source: pypi, start: "2022-01-01", days: 120, queries_per_day: 40, subagent_reports_per_day: 5, subagent_error: 0.05}
arms:
  - {name: certified, policy: {type: certified, alpha: 0.05}, memory: {per_slot: true}}
  - {name: ppi-llm, policy: {type: certified, alpha: 0.05, use_judge: true}, judge: {type: llm, max_calls: 2500}, memory: {per_slot: true}}
  - {name: guided-llm, policy: {type: certified, alpha: 0.05, use_judge: true, judge_audit_gain: 0.9}, judge: {type: llm, max_calls: 2500}, memory: {per_slot: true}}
  - {name: judge-threshold-llm, policy: {type: judge, theta: 0.5}, judge: {type: llm, max_calls: 2500}, memory: {per_slot: true}}
