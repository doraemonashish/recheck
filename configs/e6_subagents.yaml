# E6. Subagents report late. Ordering beliefs by observation time never lets an old report
# replace a newer observation; ordering by arrival does.
name: e6_subagents
alpha: 0.05
burn_in_days: 10
seeds: 10
world: {days: 60, subagent_reports_per_day: 80, subagent_delay: [0.0, 6.0]}
arms:
  - {name: obs-time-certified, policy: {type: certified, alpha: 0.05}}
  - {name: write-time-certified, policy: {type: certified, alpha: 0.05}, memory: {order: write}}
  - {name: obs-time-never, policy: {type: never}}
  - {name: write-time-never, policy: {type: never}, memory: {order: write}}
